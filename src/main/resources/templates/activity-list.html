<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Programok</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>

<nav style="background-color: #333; padding: 10px; margin-bottom: 20px;">
    <a th:href="@{/destinations}" style="color: white; margin-right: 15px; text-decoration: none;">Úticélok</a>
    <a th:href="@{/activities}" style="color: white; margin-right: 15px; text-decoration: none;">Programok</a>
    <a th:href="@{/travelers}" style="color: white; text-decoration: none;">Utazók</a>
</nav>

<h1>Programok</h1>

<a th:href="@{/activities/newactivity}" class="btn btn-add">+ Új program hozzáadása</a>

<table>
    <thead>
    <tr>
        <th>Név</th>
        <th>Dátum</th>
        <th>Költség</th>
        <th>Helyszín</th>
        <th>Műveletek</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="act : ${activities}">
        <td th:text="${act.name}">Városnézés</td>
        <td th:text="${act.date}">2026-08-10</td>
        <td th:text="${act.cost} + ' Ft'">5000 Ft</td>
        <td th:text="${act.location}">Belváros</td>
        <td>
            <a th:href="@{/activities/{id}/travelers(id=${act.id})}" class="btn btn-details">Részletek</a>
            <a th:href="@{/activities/edit/{id}(id=${act.id})}" class="btn btn-edit">Szerkesztés</a>

            <form th:action="@{/activities/delete/{id}(id=${act.id})}" method="post" style="display:inline;">
                <button type="submit" class="btn btn-delete" onclick="return confirm('Biztosan törlöd?')">Törlés</button>
            </form>
        </td>
    </tr>
    <tr th:if="${#lists.isEmpty(activities)}">
        <td colspan="5" style="text-align: center;">Még nincs rögzített program.</td>
    </tr>
    </tbody>
</table>

</body>
</html>
